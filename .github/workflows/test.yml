name: Plugin tests
on: [push, pull_request]
jobs:
    ruby:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: ruby/setup-ruby@v1
              with:
                  ruby-version: '4.0'
                  bundler-cache: true
            - run: bundle exec ruby test/test_controllers.rb
            - run: find app lib config db -name '*.rb' -exec ruby -c {} \;
